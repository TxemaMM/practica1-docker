name: ranking-dev

services:
  db:
    image: postgres:16-alpine
    env_file: .env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build: ./app
    env_file: .env.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT}:5000"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/status', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      
volumes:
  pgdata:

networks:
  frontend:
  backend:
    internal: true