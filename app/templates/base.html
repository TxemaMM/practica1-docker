<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking de videojuegos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">🎮 Game Ranking</a>
    <nav>
      {% if session.get('user_id') %}
        <span class="user">Hola, {{ session['username'] }}</span>
        <form method="post" action="{{ url_for('logout') }}">
          <button type="submit" class="btn btn-ghost">Salir</button>
        </form>
      {% else %}
        <a class="btn btn-ghost" href="{{ url_for('login') }}">Entrar</a>
        <a class="btn" href="{{ url_for('register') }}">Registrarse</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    <div id="status-panel">
      <span class="badge" id="badge-db" data-state="checking">Base de datos: …</span>
      <span class="badge" id="badge-cache" data-state="checking">Caché: …</span>
    </div>

    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script>
    const LABELS = {
      up: "✅ operativa",
      down: "❌ caída",
      disabled: "⚪ desactivada",
      checking: "… comprobando",
      unreachable: "⚠️ sin respuesta de la web"
    };

    function paint(id, name, state) {
      const el = document.getElementById(id);
      el.dataset.state = state;
      el.textContent = name + ": " + (LABELS[state] || state);
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/status", { cache: "no-store" });
        const data = await res.json();
        paint("badge-db", "Base de datos", data.database);
        paint("badge-cache", "Caché", data.cache);
      } catch (e) {
        paint("badge-db", "Base de datos", "unreachable");
        paint("badge-cache", "Caché", "unreachable");
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 3000);
  </script>
</body>
</html>
